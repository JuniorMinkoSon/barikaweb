<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layouts/admin-layout :: layout(pageTitle='Ajouter une Œuvre', content=~{::#addProductContent})}">

<div id="addProductContent">
    <div class="max-w-3xl mx-auto">
        <div class="mb-8">
            <a th:href="@{/admin/produits}"
                class="text-zipa-gold hover:text-white transition-all flex items-center gap-4 mb-6 group">
                <div
                    class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center group-hover:border-zipa-gold transition-colors text-white group-hover:text-zipa-gold">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>
                <span
                    class="text-[10px] font-sans font-bold uppercase tracking-[0.3em] text-zipa-light group-hover:text-zipa-gold transition-colors">Retour
                    à la Galerie</span>
            </a>
            <h3 class="text-4xl font-serif text-zipa-light mb-2">Nouvelle Œuvre</h3>
            <p class="text-zipa-text-muted font-light">Renseignez les détails pour l'ajout au catalogue officiel.</p>
        </div>

        <form th:action="@{/admin/produits/save}" th:object="${produit}" method="post" enctype="multipart/form-data"
            class="bg-zipa-darker border border-white/5 p-8 md:p-12 shadow-sm space-y-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 bg-zipa-gold w-full h-1"></div>

            <!-- Nom -->
            <div>
                <label
                    class="block text-[10px] font-sans font-bold uppercase tracking-widest text-zipa-text-muted mb-2">Titre
                    de l'œuvre</label>
                <input type="text" th:field="*{nom}" required
                    class="w-full px-4 py-3 bg-zipa-dark border border-white/5 focus:border-zipa-gold outline-none transition-all text-zipa-light font-serif text-xl"
                    placeholder="Ex: Reflets d'Ébène">
            </div>

            <!-- Catégorie & Prix -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label
                        class="block text-[10px] font-sans font-bold uppercase tracking-widest text-zipa-text-muted mb-2">Technique
                        / Catégorie</label>
                    <select th:field="*{categorie}" required
                        class="w-full px-4 py-4 bg-zipa-dark border border-white/5 focus:border-zipa-gold outline-none transition-all text-zipa-light font-light cursor-pointer appearance-none">
                        <option value="" class="bg-zipa-dark">Sélectionner</option>
                        <option value="Huile sur Toile" class="bg-zipa-dark">Huile sur Toile</option>
                        <option value="Acrylique" class="bg-zipa-dark">Acrylique</option>
                        <option value="Mixte" class="bg-zipa-dark">Technique Mixte</option>
                        <option value="Aquarelle" class="bg-zipa-dark">Aquarelle</option>
                    </select>
                </div>
                <div>
                    <label
                        class="block text-[10px] font-sans font-bold uppercase tracking-widest text-zipa-text-muted mb-2">Valeur
                        (CFA)</label>
                    <input type="number" th:field="*{prix}" required
                        class="w-full px-4 py-4 bg-zipa-dark border border-white/5 focus:border-zipa-gold outline-none transition-all text-zipa-light font-bold"
                        placeholder="0">
                </div>
            </div>

            <!-- Description -->
            <div>
                <label
                    class="block text-[10px] font-sans font-bold uppercase tracking-widest text-zipa-text-muted mb-2">Description
                    / Histoire</label>
                <textarea th:field="*{description}" rows="5"
                    class="w-full px-4 py-4 bg-zipa-dark border border-white/5 focus:border-zipa-gold outline-none transition-all text-zipa-light font-light leading-relaxed"
                    placeholder="Décrivez l'inspiration, les dimensions, etc..."></textarea>
            </div>

            <!-- Image -->
            <div>
                <label
                    class="block text-[10px] font-sans font-bold uppercase tracking-widest text-zipa-text-muted mb-2">Photographie
                    de l'œuvre</label>
                <div class="relative group">
                    <input type="file" name="image" required id="imageInput"
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div
                        class="border border-dashed border-white/20 group-hover:border-zipa-gold p-12 text-center transition-all bg-zipa-dark">
                        <i
                            class="fa-regular fa-image text-3xl text-zipa-gray group-hover:text-zipa-gold mb-4 transition-colors"></i>
                        <p class="text-sm font-sans font-bold text-zipa-text-muted" id="fileName">Téléverser une image
                            de haute qualité</p>
                        <p class="text-[10px] text-zipa-gray mt-2 uppercase tracking-widest">JPG, PNG, WEBP</p>
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <div class="pt-6 text-center">
                <button type="submit"
                    class="btn-zipa !bg-zipa-gold !text-zipa-dark !justify-center !px-16 shadow-[0_10px_30px_rgba(212,175,55,0.2)] hover:!bg-white">
                    EXPOSER L'ŒUVRE
                </button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    document.getElementById('imageInput').addEventListener('change', function (e) {
        const fileName = e.target.files[0]?.name || 'Téléverser une image de haute qualité';
        document.getElementById('fileName').textContent = fileName;
        document.getElementById('fileName').classList.remove('text-zipa-text-muted');
        document.getElementById('fileName').classList.add('text-zipa-gold');
    });
</script>

</html>
