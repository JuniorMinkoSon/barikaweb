<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head (title='Atelier - Peintre Zipa Officiel')}"></head>

<body class="bg-zipa-darker min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Brand Background Decoration -->
    <div class="absolute inset-0 opacity-20 pointer-events-none">
        <div
            class="absolute top-0 right-0 w-[50rem] h-[50rem] bg-zipa-gold/20 rounded-full blur-[10rem] -translate-y-1/2 translate-x-1/2">
        </div>
        <div
            class="absolute bottom-0 left-0 w-[40rem] h-[40rem] bg-zipa-dark/50 rounded-full blur-[8rem] translate-y-1/2 -translate-x-1/2">
        </div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <!-- Logo -->
        <div class="text-center mb-16 animate-fade-in">
            <a th:href="@{/}" class="flex flex-col mb-10 group">
                <span
                    class="text-5xl font-serif text-zipa-gold leading-none group-hover:scale-105 transition-transform">ZIPA</span>
                <span
                    class="text-xs font-sans font-bold tracking-[0.3em] text-zipa-text-muted uppercase leading-none mt-2">Peintre
                    Officiel</span>
            </a>
            <h2 class="text-2xl font-serif uppercase tracking-widest text-zipa-light mb-2">PORTES DE <span
                    class="italic text-zipa-gold">l'Atelier</span></h2>
        </div>

        <!-- Login Card -->
        <div class="bg-zipa-dark border border-white/10 p-12 md:p-16 shadow-2xl animate-slide-up relative">
            <div class="absolute top-0 left-0 w-12 h-1 bg-zipa-gold"></div>
            <form th:action="@{/login}" method="post" class="space-y-8">
                <!-- Message d'erreur -->
                <div th:if="${param.error}"
                    class="p-5 bg-red-500/10 border border-red-500/30 text-red-500 text-[10px] font-sans font-bold uppercase tracking-widest text-center animate-shake">
                    <i class="fa-solid fa-circle-exclamation mr-3 text-sm"></i> Clé incorrecte
                </div>

                <div class="space-y-3">
                    <label
                        class="text-[10px] uppercase font-sans font-bold tracking-[0.2em] text-zipa-text-muted block ml-1">Courriel
                        de l'artiste</label>
                    <div class="relative group">
                        <i
                            class="fa-regular fa-envelope absolute left-6 top-1/2 -translate-y-1/2 text-zipa-gray group-focus-within:text-zipa-gold transition-colors"></i>
                        <input type="email" name="email" required
                            class="w-full bg-zipa-darker border border-white/5 py-5 pl-14 pr-6 focus:outline-none focus:border-zipa-gold outline-none transition-all text-zipa-light placeholder-zipa-gray/50 font-light"
                            placeholder="artiste@zipa.art">
                    </div>
                </div>

                <div class="space-y-3">
                    <label
                        class="text-[10px] uppercase font-sans font-bold tracking-[0.2em] text-zipa-text-muted block ml-1">Code
                        Secret</label>
                    <div class="relative group">
                        <i
                            class="fa-solid fa-lock absolute left-6 top-1/2 -translate-y-1/2 text-zipa-gray group-focus-within:text-zipa-gold transition-colors"></i>
                        <input type="password" name="password" required
                            class="w-full bg-zipa-darker border border-white/5 py-5 pl-14 pr-6 focus:outline-none focus:border-zipa-gold outline-none transition-all text-zipa-light placeholder-zipa-gray/50 font-light"
                            placeholder="••••••••">
                    </div>
                </div>

                <div
                    class="flex items-center justify-between text-[10px] font-sans font-bold uppercase tracking-widest text-zipa-text-muted px-2">
                    <label class="flex items-center gap-3 cursor-pointer hover:text-zipa-light transition-colors">
                        <input type="checkbox"
                            class="w-4 h-4 rounded-sm border-white/10 bg-zipa-darker checked:bg-zipa-gold focus:ring-zipa-gold cursor-pointer accent-zipa-gold">
                        Rester connecté
                    </label>
                </div>

                <button type="submit"
                    class="w-full btn-zipa !bg-zipa-gold !text-zipa-dark !justify-center !py-6 !text-sm shadow-[0_10px_40px_rgba(212,175,55,0.2)] hover:!bg-white">
                    ENTRER DANS L'ATELIER <i class="fa-solid fa-arrow-right ml-3"></i>
                </button>
            </form>
        </div>

        <!-- Back Link -->
        <div class="mt-12 text-center animate-fade-in delay-300">
            <a th:href="@{/}"
                class="text-zipa-text-muted hover:text-zipa-gold transition-all flex items-center justify-center gap-4 group">
                <i class="fa-solid fa-arrow-left text-xs group-hover:-translate-x-2 transition-transform"></i>
                <span class="text-[10px] font-sans font-bold uppercase tracking-[0.3em]">Retourner à la Galerie</span>
            </a>
        </div>
    </div>

</body>

</html>
