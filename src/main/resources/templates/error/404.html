<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Page Introuvable - 404 - Grace Service Déménagement')}"></head>

<body>

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- MAIN CONTENT -->
    <main class="min-h-screen flex items-center justify-center py-40 bg-gsd-blue-dark relative overflow-hidden">

        <!-- Abstract Background -->
        <div class="absolute inset-0 opacity-10 pointer-events-none">
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[40rem] font-black tracking-tighter leading-none select-none">
                404</div>
        </div>

        <div class="section-gsd relative z-10 text-center">
            <div
                class="w-32 h-32 mx-auto mb-12 bg-gsd-red/10 rounded-[2.5rem] flex items-center justify-center border border-gsd-red/20 shadow-[0_0_50px_rgba(227,30,36,0.1)]">
                <i class="fa-solid fa-box-open text-5xl text-gsd-red"></i>
            </div>

            <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter text-gsd-white mb-8">
                COLIS <span class="text-gsd-red">INTROUVABLE</span>
            </h1>

            <p
                class="text-gsd-light/50 text-lg md:text-xl max-w-2xl mx-auto mb-16 font-bold uppercase tracking-widest leading-relaxed">
                Le chemin que vous cherchez n'existe pas ou a été déplacé vers une nouvelle destination.
            </p>

            <div class="flex flex-col md:flex-row gap-8 justify-center items-center">
                <a th:href="@{/}" class="btn-gsd !px-12 !py-6 !text-lg shadow-[0_20px_60px_rgba(212,175,55,0.2)]">
                    RETOUR À L'ACCUEIL <i class="fa-solid fa-house ml-3"></i>
                </a>
                <a th:href="@{/services}"
                    class="text-gsd-white hover:text-gsd-gold font-black uppercase tracking-[0.4em] text-xs transition-colors flex items-center gap-4">
                    NOS SOLUTIONS <i class="fa-solid fa-arrow-right-long text-gsd-gold"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
