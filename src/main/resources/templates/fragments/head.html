<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Peintre Zipa Officiel - Artiste Peintre à Abidjan. Découvrez et achetez ses œuvres originales, explorez son univers artistique.">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Palette Peintre Zipa Officiel
                        'zipa-dark': '#0a0a0a',     /* Deep Noir/Charcoal */
                        'zipa-darker': '#000000',
                        'zipa-light': '#FDFBF7',    /* Warm Off-White / Gallery wall */
                        'zipa-gray': '#EAE5DF',     /* Soft gray for borders */
                        'zipa-gold': '#C6A87C',     /* Elegant Gold / Copper accent */
                        'zipa-gold-hover': '#b5976b',
                        'zipa-text-light': '#ffffff',
                        'zipa-text-muted': '#9ca3af',
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'serif': ['"Playfair Display"', 'serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'fade-in-up': 'fadeInUp 1s ease-out forwards',
                        'slow-zoom': 'slowZoom 20s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slowZoom: {
                            '0%': { transform: 'scale(1)' },
                            '100%': { transform: 'scale(1.1)' },
                        }
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/images/favicon-256x256.png}" type="image/x-icon">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Titre dynamique -->
    <title th:text="${title}">Peintre Zipa Officiel</title>

    <!-- Styles Tailwind personnalisés -->
    <style type="text/tailwindcss">
        @layer utilities {
            .btn-zipa {
                @apply bg-zipa-gold text-zipa-dark font-semibold py-3 px-8 rounded-none tracking-widest uppercase text-sm
                       transition-all duration-300 hover:bg-zipa-gold-hover hover:scale-105 inline-flex items-center justify-center gap-3;
            }
            .btn-zipa-outline {
                @apply border border-zipa-gold text-zipa-gold font-semibold py-3 px-8 rounded-none tracking-widest uppercase text-sm
                       transition-all duration-300 hover:bg-zipa-gold hover:text-zipa-dark inline-flex items-center justify-center gap-3;
            }
            .btn-zipa-dark {
                @apply bg-zipa-dark text-zipa-light font-semibold py-3 px-8 rounded-none tracking-widest uppercase text-sm border border-zipa-dark
                       transition-all duration-300 hover:bg-zipa-light hover:text-zipa-dark inline-flex items-center justify-center gap-3;
            }
            .section-zipa {
                @apply py-24 px-6 md:px-12 lg:px-24 max-w-[100rem] mx-auto;
            }
            .heading-primary {
                @apply font-serif text-5xl md:text-7xl lg:text-8xl text-zipa-dark tracking-tight leading-tight;
            }
            .heading-secondary {
                @apply font-serif text-3xl md:text-5xl text-zipa-dark tracking-tight mb-8;
            }
            .glass-panel {
                @apply bg-zipa-dark/80 backdrop-blur-lg border border-white/10 p-8;
            }
            .zipa-nav-link {
                @apply text-xs font-sans font-semibold uppercase tracking-[0.2em] text-zipa-dark/80 hover:text-zipa-dark transition-all duration-300 relative pb-1;
            }
            .zipa-nav-link::after {
                content: '';
                @apply absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-[1px] bg-zipa-gold transition-all duration-300;
            }
            .zipa-nav-link:hover::after {
                @apply w-full;
            }
            .reveal-on-scroll {
                @apply opacity-0 translate-y-10 transition-all duration-[1500ms] ease-out;
            }
            .reveal-on-scroll.is-revealed {
                @apply opacity-100 translate-y-0;
            }
            .hide-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .hide-scrollbar {
                -ms-overflow-style: none;  /* IE and Edge */
                scrollbar-width: none;  /* Firefox */
            }
        }
        
        @layer base {
            body {
                @apply bg-zipa-light text-zipa-dark selection:bg-zipa-gold selection:text-zipa-dark font-sans;
            }
            h1, h2, h3, h4, h5, h6 {
                @apply font-serif;
            }
            p {
                @apply text-zipa-dark/80 leading-relaxed font-light;
            }
        }
    </style>
</head>

</html>

</html>
