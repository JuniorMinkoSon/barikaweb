<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="header">
    <!-- Header Zipa - Elegant & Minimal -->
    <header class="fixed w-full top-0 z-50 bg-zipa-light/90 backdrop-blur-md shadow-sm transition-all duration-300">
        <div class="max-w-[100rem] mx-auto px-6 py-5 flex justify-between items-center">
            <!-- LOGO / BRANDING -->
            <a th:href="@{/}" class="flex flex-col items-center">
                <span class="text-3xl font-serif font-bold tracking-widest text-zipa-dark mb-1">ZIPA</span>
                <span class="text-[10px] font-sans font-semibold tracking-[0.4em] text-zipa-gold uppercase">Artiste
                    Peintre</span>
            </a>

            <!-- NAVIGATION -->
            <nav class="hidden lg:flex items-center gap-12">
                <a th:href="@{/}" class="zipa-nav-link">Accueil</a>
                <a th:href="@{/services}" class="zipa-nav-link">Galerie</a>
                <a th:href="@{/propos}" class="zipa-nav-link">À propos</a>
                <a th:href="@{/contact}" class="zipa-nav-link">Contact</a>

                <a th:href="@{/panier}"
                    class="relative text-zipa-dark hover:text-zipa-gold transition-colors duration-300 group ml-4 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span th:if="${cartCount > 0}"
                        class="absolute -top-2 -right-3 bg-zipa-dark text-zipa-light text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-lg"
                        th:text="${cartCount}">0</span>
                </a>
            </nav>

            <!-- BOUTONS ACTIONS -->
            <div class="hidden lg:flex items-center gap-6">
                <!-- Connexion -->
                <a th:href="@{/login}" sec:authorize="isAnonymous()"
                    class="text-zipa-dark/70 hover:text-zipa-gold transition-colors" aria-label="Connexion">
                    <i class="fa-regular fa-user text-xl"></i>
                </a>

                <!-- Mon Compte -->
                <div sec:authorize="isAuthenticated()" class="flex items-center gap-4">
                    <a th:href="@{/logout}" class="text-zipa-dark/70 hover:text-zipa-gold transition-colors"
                        aria-label="Déconnexion">
                        <i class="fa-solid fa-arrow-right-from-bracket text-xl"></i>
                    </a>
                </div>

                <a th:href="@{/services}" class="btn-zipa !py-2 !px-6 text-xs">
                    VOIR LES ŒUVRES
                </a>
            </div>

            <!-- MENU BURGER MOBILE -->
            <button class="lg:hidden text-zipa-dark text-2xl" onclick="toggleMobileMenu()" aria-label="Menu">
                <i class="fa-solid fa-bars" id="menuIcon"></i>
            </button>
        </div>

        <!-- MENU MOBILE -->
        <div id="mobileMenu"
            class="hidden lg:hidden bg-zipa-light border-t border-zipa-gray animate-fade-in shadow-lg absolute w-full left-0">
            <nav class="flex flex-col p-8 gap-6">
                <a th:href="@{/}" class="text-2xl font-serif text-zipa-dark hover:text-zipa-gold">Accueil</a>
                <a th:href="@{/services}" class="text-2xl font-serif text-zipa-dark hover:text-zipa-gold">Galerie</a>
                <a th:href="@{/propos}" class="text-2xl font-serif text-zipa-dark hover:text-zipa-gold">À propos</a>
                <a th:href="@{/contact}" class="text-2xl font-serif text-zipa-dark hover:text-zipa-gold">Contact</a>

                <div class="h-px bg-zipa-gray my-2"></div>

                <div class="flex items-center justify-between">
                    <a href="tel:+2250102030405" class="text-lg font-sans text-zipa-gold">+225 01 02 03 04 05</a>
                    <a th:href="@{/login}" class="text-zipa-dark text-2xl"><i class="fa-regular fa-user"></i></a>
                </div>

                <a th:href="@{/services}" class="btn-zipa text-center mt-4">Découvrir les œuvres</a>
            </nav>
        </div>
    </header>

    <!-- Spacer pour le header fixe -->
    <div class="h-[90px]"></div>

    <script>
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            const menuIcon = document.getElementById('menuIcon');
            mobileMenu.classList.toggle('hidden');

            if (mobileMenu.classList.contains('hidden')) {
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
            } else {
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');
            }
        }
    </script>
</div>

</html>
