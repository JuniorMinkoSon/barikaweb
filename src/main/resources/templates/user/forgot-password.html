<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head (title='Récupération - Grace Service Déménagement')}"></head>

<body>

    <!-- MAIN CONTENT -->
    <main class="min-h-screen flex items-center justify-center py-20 bg-gsd-blue-dark relative overflow-hidden">

        <!-- Abstract Background -->
        <div class="absolute inset-0 opacity-20 pointer-events-none">
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[40rem] font-black tracking-tighter leading-none select-none opacity-5 italic">
                ?</div>
        </div>

        <!-- Bouton Retour Login -->
        <a th:href="@{/login}"
            class="absolute top-12 left-12 z-20 text-gsd-white/40 hover:text-gsd-gold flex items-center gap-4 transition-all group">
            <div
                class="w-10 h-10 rounded-full border border-gsd-white/10 flex items-center justify-center group-hover:border-gsd-gold transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
            <span class="text-[10px] font-black uppercase tracking-[0.3em]">Retour Connexion</span>
        </a>

        <div class="relative z-10 w-full max-w-lg px-6">
            <div class="card-gsd p-12 md:p-16 rounded-[4rem] animate-slide-up">

                <!-- Brand -->
                <div class="text-center mb-16">
                    <h1 class="text-2xl font-black uppercase tracking-tighter text-gsd-white mb-4">MOT DE PASSE <span
                            class="text-gsd-gold">OUBLIÉ</span></h1>
                    <p class="text-gsd-light/40 text-[10px] font-black uppercase tracking-widest leading-relaxed">
                        Entrez votre email pour recevoir un lien de réinitialisation.
                    </p>
                </div>

                <!-- Form -->
                <form th:action="@{/forgot-password}" method="post" class="space-y-8">
                    <div class="space-y-3">
                        <label
                            class="text-[10px] uppercase font-black tracking-[0.2em] text-gsd-white/40 block ml-1">Adresse
                            Email</label>
                        <input type="email" name="email" required
                            class="w-full bg-gsd-white/5 border border-gsd-white/10 rounded-2xl py-5 px-6 focus:border-gsd-gold outline-none transition-all text-gsd-white"
                            placeholder="votre@email.com">
                    </div>

                    <button type="submit"
                        class="btn-gsd w-full justify-center !py-6 !text-xl shadow-[0_20px_60px_rgba(212,175,55,0.2)] mt-8">
                        ENVOYER LE LIEN <i class="fa-solid fa-paper-plane ml-3"></i>
                    </button>
                </form>

                <div th:if="${success}"
                    class="mt-8 p-5 glass-gsd border-gsd-gold/30 rounded-2xl text-gsd-gold text-[10px] font-black uppercase tracking-widest text-center animate-fade-in">
                    <i class="fa-solid fa-circle-check mr-3 text-sm"></i> Email de récupération envoyé
                </div>
            </div>
        </div>
    </main>

</body>

</html>
