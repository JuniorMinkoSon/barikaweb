<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Inscription - Peintre Zipa Officiel')}"></head>

<body class="bg-zipa-darker overflow-hidden">

    <div class="min-h-screen flex">

        <!-- LEFT: Carousel artwork panel -->
        <div class="hidden lg:block lg:w-1/2 relative overflow-hidden">
            <div id="regCarouselContainer" class="absolute inset-0"></div>
            <div class="absolute inset-0 bg-gradient-to-r from-zipa-darker/80 to-transparent z-10"></div>
            <div class="absolute inset-0 z-20 flex flex-col justify-end p-16">
                <a th:href="@{/}" class="flex flex-col mb-6">
                    <span class="text-5xl font-serif font-bold tracking-widest text-zipa-light leading-none">ZIPA</span>
                    <span class="text-[10px] font-sans font-bold tracking-[0.4em] text-zipa-gold uppercase mt-1">Artiste
                        Peintre Officiel</span>
                </a>
                <p class="text-zipa-light/60 font-light text-sm max-w-xs leading-relaxed">
                    Rejoignez notre cercle de collectionneurs et recevez un accès exclusif aux nouvelles créations avant
                    leur mise en vente publique.
                </p>
            </div>
        </div>

        <!-- RIGHT: Register form -->
        <div
            class="w-full lg:w-1/2 flex flex-col items-center justify-center px-8 md:px-16 xl:px-24 min-h-screen relative bg-zipa-darker">

            <!-- Back button -->
            <a th:href="@{/}"
                class="absolute top-10 left-10 text-zipa-text-muted hover:text-zipa-gold flex items-center gap-3 transition-all group">
                <div
                    class="w-9 h-9 rounded-full border border-white/10 flex items-center justify-center group-hover:border-zipa-gold transition-colors">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-[0.3em]">Accueil</span>
            </a>

            <div class="w-full max-w-sm">
                <!-- Mobile brand -->
                <div class="lg:hidden mb-12 text-center">
                    <span class="text-4xl font-serif font-bold tracking-widest text-zipa-light">ZIPA</span>
                    <p class="text-[10px] font-bold tracking-[0.4em] text-zipa-gold uppercase mt-1">Artiste Peintre</p>
                </div>

                <div class="mb-10">
                    <span
                        class="text-zipa-gold font-sans font-bold uppercase tracking-[0.4em] text-[10px] mb-3 block">Rejoindre
                        le Cercle</span>
                    <h1 class="font-serif text-4xl text-zipa-light">Créer un <span
                            class="italic font-light text-zipa-gold">Compte</span></h1>
                </div>

                <form th:action="@{/register}" method="post" class="space-y-5">

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase font-bold tracking-[0.2em] text-zipa-text-muted block">Nom
                            Complet</label>
                        <div class="relative group">
                            <i
                                class="fa-regular fa-user absolute left-5 top-1/2 -translate-y-1/2 text-zipa-text-muted group-focus-within:text-zipa-gold transition-colors text-sm"></i>
                            <input type="text" name="nomComplet" required
                                class="w-full bg-white/5 border border-white/10 py-4 pl-12 pr-5 focus:outline-none focus:border-zipa-gold transition-all text-zipa-light placeholder:text-white/20 font-sans text-sm"
                                placeholder="Votre Nom">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label
                            class="text-[10px] uppercase font-bold tracking-[0.2em] text-zipa-text-muted block">Adresse
                            Email</label>
                        <div class="relative group">
                            <i
                                class="fa-regular fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-zipa-text-muted group-focus-within:text-zipa-gold transition-colors text-sm"></i>
                            <input type="email" name="email" required
                                class="w-full bg-white/5 border border-white/10 py-4 pl-12 pr-5 focus:outline-none focus:border-zipa-gold transition-all text-zipa-light placeholder:text-white/20 font-sans text-sm"
                                placeholder="votre@email.com">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] uppercase font-bold tracking-[0.2em] text-zipa-text-muted block">Mot
                            de Passe</label>
                        <div class="relative group">
                            <i
                                class="fa-solid fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-zipa-text-muted group-focus-within:text-zipa-gold transition-colors text-sm"></i>
                            <input type="password" name="password" required
                                class="w-full bg-white/5 border border-white/10 py-4 pl-12 pr-5 focus:outline-none focus:border-zipa-gold transition-all text-zipa-light placeholder:text-white/20 font-sans text-sm"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <!-- Error/success message -->
                    <div th:if="${error}"
                        class="flex items-center gap-3 border border-red-500/30 bg-red-500/10 p-4 text-red-400 text-xs font-bold uppercase tracking-widest">
                        <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}">Erreur</span>
                    </div>

                    <button type="submit"
                        class="w-full bg-zipa-gold text-zipa-dark font-bold py-5 uppercase tracking-widest text-sm hover:bg-white transition-colors duration-300 flex items-center justify-center gap-3 mt-2">
                        CRÉER MON COMPTE <i class="fa-solid fa-user-plus"></i>
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-white/5 text-center">
                    <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-zipa-text-muted">
                        Déjà Collectionneur ?
                        <a th:href="@{/login}" class="text-zipa-gold hover:text-white transition-colors ml-3">Se
                            connecter</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const container = document.getElementById('regCarouselContainer');
            if (!container) return;
            const total = 20;
            let cur = 10, timer; // Start from middle to differ from login page
            let html = '';
            for (let i = 1; i <= total; i++) {
                const num = ((i + 9) % total) + 1; // offset start
                html += `<div class="reg-slide absolute inset-0 transition-opacity duration-1500 ease-in-out ${i === 1 ? 'opacity-100' : 'opacity-0'}">
                    <img src="/images/photo_${20 + i}_2026-03-04_10-55-27.jpg" class="w-full h-full object-cover" alt=""></div>`;
            }
            container.innerHTML = html;
            const slides = container.querySelectorAll('.reg-slide');
            function goTo(i) {
                slides.forEach((s, idx) => {
                    s.classList.toggle('opacity-100', idx === i);
                    s.classList.toggle('opacity-0', idx !== i);
                });
                cur = i;
                clearInterval(timer); timer = setInterval(() => goTo((cur + 1) % total), 4500);
            }
            timer = setInterval(() => goTo((cur + 1) % total), 4500);
        })();
    </script>

</body>

</html>
